<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="crumb"><a href="./">首页</a> › <span id="ai-crumb">AI 前沿技术瞭望台</span></div>

    <!-- 栏目头图：一句话说清这个栏目看什么、有多少内容、多久更新 -->
    <section class="ai-banner">
      <div class="ai-banner-body">
        <div class="ai-badge">AI WATCH · 前沿观察</div>
        <h1>AI 前沿技术瞭望台</h1>
        <p>大模型与算法、算力与芯片、智能体应用、治理与产业 —— 四条赛道持续跟踪，只挑真正推动技术边界的那几条。</p>
        <div class="ai-stats" id="ai-stats"></div>
      </div>
      <div class="ai-banner-side">
        <div class="ai-side-title">赛道速览</div>
        <ul class="ai-side-list" id="ai-tracks-mini"></ul>
      </div>
    </section>

    <div class="layout" style="padding-top:0;">
      <div>
        <div class="card">
          <div class="card-head">
            <div class="card-title">瞭望头条</div>
            <span class="card-more" id="ai-updated"></span>
          </div>
          <div id="ai-lead"><div class="skeleton" style="height:200px"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">四条观察赛道</div>
            <span class="card-more">按内容关键词自动归组</span>
          </div>
          <div class="track-grid" id="ai-tracks"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">前沿速递</div>
            <span class="card-more" id="ai-count"></span>
          </div>
          <ul class="news-list" id="ai-list"><li class="empty">加载中…</li></ul>
          <div class="pagination" id="ai-pagination"></div>
        </div>
      </div>

      <aside>
        <div class="card">
          <div class="card-head"><div class="card-title">瞭望榜</div><span class="card-more">栏目内热度</span></div>
          <div id="ai-hot"><div class="skeleton" style="height:240px"></div></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">技术热词</div></div>
          <div class="tag-cloud" id="ai-tags"></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">更新轨迹</div><span class="card-more">近 7 天</span></div>
          <div class="timeline" id="ai-timeline"></div>
        </div>

        <div class="card" style="background:linear-gradient(135deg,#5b1fa8,#7e22ce);color:#fff;box-shadow:var(--shadow-hover);">
          <div style="font-size:17px;font-weight:700;margin-bottom:6px;">关于瞭望台</div>
          <p style="margin:0 0 10px;font-size:13px;opacity:.88;line-height:1.85;">
            栏目稿件与全站同一套采编流程产出：采集入库 → 自动审核 → 发布上线，App 端信息流同步可读。
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;">
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">大模型</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">算力芯片</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">智能体</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">AI 治理</span>
          </div>
        </div>
      </aside>
