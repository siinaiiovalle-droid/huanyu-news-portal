<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./static-shim.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寰宇新闻网 - 洞察世界 · 传递真相 · 连接未来</title>
  <meta name="description" content="寰宇新闻网是寰宇传媒信息技术股份有限公司旗下的综合新闻门户，提供国内、国际、财经、科技、体育、娱乐、汽车、文化、健康等频道的最新资讯与视频报道。">
  <meta name="keywords" content="新闻,头条,热点,财经,科技,体育,娱乐,视频,寰宇新闻网">
  <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23e8eef6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23cfd9e6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20font-family%3D%22Microsoft%20YaHei%2CPingFang%20SC%2Csans-serif%22%20font-size%3D%225%22%20fill%3D%22%237b8794%22%3E%E5%AF%B0%E5%AE%87%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header id="site-header"></header>

  <!-- 通栏快讯条：新浪式"24 小时滚动快讯"，数据取首页最新稿，与 App 推送同源 -->
  <div class="flash" id="flash" hidden>
    <div class="container">
      <span class="flash-tag"><i></i>寰宇快讯</span>
      <div class="flash-view"><ul id="flash-list"></ul></div>
      <span class="flash-updated" id="flash-updated"></span>
      <a class="flash-more" href="./channel.html?id=china">全部要闻 ›</a>
    </div>
  </div>

  <main class="container">
    <!-- 头条区 -->
    <section class="layout" style="padding-bottom:0;">
      <div>
        <div class="hero" id="hero"><div class="skeleton" style="height:340px"></div></div>

        <div class="card" style="margin-top:18px;">
          <div class="card-head">
            <div class="card-title">最新发布</div>
            <a class="card-more" href="./channel.html?id=china">更多要闻 ›</a>
          </div>
          <ul class="news-list" id="latest-list"><li class="empty">加载中…</li></ul>
        </div>

        <div id="channel-blocks"></div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">焦点专题</div>
            <span class="card-more">编辑部精选</span>
          </div>
          <div class="focus-grid" id="focus-grid"><div class="skeleton" style="height:180px"></div></div>
        </div>
      </div>

      <aside>
        <div class="card">
          <div class="card-head">
            <div class="card-title">实时热点榜</div>
            <span class="card-more" id="hot-updated"></span>
          </div>
          <div id="hot-rank"><div class="skeleton" style="height:240px"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">爆款增速榜</div>
            <span class="card-more">近 48 小时</span>
          </div>
          <div id="blast-rank"><div class="skeleton" style="height:200px"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">视频精选</div>
            <a class="card-more" href="./video.html">全部视频 ›</a>
          </div>
          <div id="video-mini" style="display:grid;gap:10px;"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">热门话题</div>
          </div>
          <div class="tag-cloud" id="tag-cloud"></div>
        </div>

        <div class="card" style="background:linear-gradient(135deg,#0b4f9e,#1467c6);color:#fff;box-shadow:var(--shadow-hover);">
          <div style="font-size:18px;font-weight:700;margin-bottom:6px;">寰宇 App 即将上线</div>
          <p style="margin:0 0 12px;font-size:13.5px;opacity:.86;line-height:1.8;">
            资讯、短视频与直播、聊天、支付、在线购物、小程序服务一体化。新闻内容与本站实时同步，一处生产、多端触达。
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;">
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">新闻同步</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">短视频 · 直播</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">即时通讯</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">支付 · 购物</span>
            <span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;">小程序生态</span>
          </div>
        </div>
      </aside>
    </section>

    <div class="card" style="margin-top:20px;">
      <div class="card-head">
        <div class="card-title">图集精选</div>
        <span class="card-more">现场影像</span>
      </div>
      <div class="focus-grid" id="picture-grid"></div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="./js/common.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
